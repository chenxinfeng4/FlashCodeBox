<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件快递 · 用取件码收发文本与文件</title>
<meta name="description" content=" FileSender —— 用取件码安全收发文本与文件，支持反向代理子路径部署">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M7 9h10M7 13h7M12 17l3-3-3-3' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="./">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 9h10M7 13h7M12 17l3-3-3-3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </span>
    <span class="brand-name" id="siteName">文件快递</span>
    <span class="brand-sub" id="siteDesc"></span>
  </a>
  <nav class="topbar-nav">
    <a href="#/admin" class="admin-link">管理</a>
    <button class="theme-btn" id="themeBtn" type="button" title="切换明暗主题" aria-label="切换明暗主题">🌙</button>
  </nav>
</header>

<div class="banner" id="setupBanner" hidden>
  首次使用：请先 <a href="#/admin">设置管理密码</a> 完成初始化。
</div>

<!-- ===================== 主视图：发送 + 取件 ===================== -->
<main class="layout" id="mainView">

  <!-- 发送：微信式聊天窗口，文字+文件混搭 -->
  <section class="card" id="sendPanel" aria-label="发送">
    <div class="chat-head">
      <div class="expire-inline" id="expireCtrl" title="有效期">
        <select id="expireStyle" aria-label="有效期单位">
          <option value="day" selected>天</option>
          <option value="hour">小时</option>
          <option value="minute">分钟</option>
          <option value="count">可取次数</option>
          <option value="forever">永久</option>
        </select>
        <input id="expireValue" type="number" value="3" min="1" max="9999" aria-label="有效期数值">
      </div>
      <div class="chat-head-spacer"></div>
      <div class="chat-code-area" id="codeArea" hidden>
        <span class="chat-code-label">取件码</span>
        <span class="chat-code" id="resultCode">—</span>
        <button class="iconbtn" id="copyCodeBtn" type="button" title="复制取件码" aria-label="复制取件码">
          <svg viewBox="0 0 24 24" width="15" height="15"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5 15V5a2 2 0 012-2h10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" id="copyLinkBtn" type="button" title="复制取件链接" aria-label="复制取件链接">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M10 14a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M14 10a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="iconbtn" id="newShareBtn" type="button" title="新开分享" aria-label="新开分享" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="chat-flow" id="chatFlow"></div>

    <div class="composer" id="composer">
      <textarea id="sendText" rows="1" placeholder="输入消息…"></textarea>
      <div class="composer-bar">
        <button class="attachbtn" id="attachBtn" type="button" title="添加文件（可多选）" aria-label="添加文件">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l8.9-8.9a3.7 3.7 0 015.2 5.2l-8.9 8.9a1.8 1.8 0 01-2.6-2.6l8.2-8.2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input type="file" id="fileInput" multiple hidden>
        <div class="spacer"></div>
        <button class="sendbtn" id="sendBtn" type="button" title="发送" aria-label="发送">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="alert err" id="sendError" hidden></div>
  </section>

  <!-- 取件 -->
  <section class="card" id="getPanel" aria-label="取件">
    <div class="card-head">
      <h2><span class="dot dot-get"></span>取件</h2>
    </div>

    <form class="get-form" id="getForm">
      <input id="getCode" class="code-input" placeholder="输入取件码" maxlength="5"
             autocomplete="off" spellcheck="false" inputmode="numeric">
      <button class="btn primary" id="getBtn" type="submit">取 件</button>
    </form>

    <div class="alert err" id="getError" hidden></div>

    <div class="result" id="getResult" hidden>
      <div class="pick-meta hint" id="pickMeta"></div>
      <div class="pick-items" id="pickItems"></div>
      <button class="btn ghost" id="pickAgainBtn">再取一个</button>
    </div>
  </section>
</main>

<!-- ===================== 管理视图 ===================== -->
<main class="layout admin" id="adminView" hidden>

  <section class="card narrow" id="adminAuthCard">
    <div class="card-head"><h2><span class="dot dot-admin"></span><span id="adminAuthTitle">管理登录</span></h2></div>

    <form id="loginForm" class="stack">
      <label class="field"><span>管理密码</span>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="输入管理密码">
      </label>
      <button class="btn primary btn-block" type="submit">登 录</button>
    </form>

    <form id="setupForm" class="stack" hidden>
      <p class="hint">首次使用，请设置管理密码（至少 8 位）。密码仅用于管理后台，收发分享不需要它。</p>
      <label class="field"><span>设置管理密码</span>
        <input type="password" id="setupPassword" autocomplete="new-password" placeholder="至少 8 位">
      </label>
      <label class="field"><span>确认密码</span>
        <input type="password" id="setupPassword2" autocomplete="new-password" placeholder="再输入一次">
      </label>
      <button class="btn primary btn-block" type="submit">完成初始化</button>
    </form>

    <div class="alert err" id="adminAuthError" hidden></div>
  </section>

  <section class="card" id="adminPanel" hidden>
    <div class="card-head">
      <h2><span class="dot dot-admin"></span>站点管理</h2>
      <button class="btn ghost" id="logoutBtn">退出登录</button>
    </div>

    <details open>
      <summary>站点配置</summary>
      <form id="configForm" class="config-grid">
        <label class="field"><span>站点名称</span><input id="cfgName" maxlength="60"></label>
        <label class="field span2"><span>站点描述</span><input id="cfgDesc" maxlength="200"></label>
        <label class="field"><span>单文件上限 (MB)</span><input id="cfgMaxUpload" type="number" min="1" step="1"></label>
        <label class="field"><span>文本上限 (KB)</span><input id="cfgMaxText" type="number" min="1" step="1"></label>
        <label class="field"><span>分片大小 (MB)</span><input id="cfgChunk" type="number" min="1" step="1"></label>
        <label class="field"><span>取件码类型</span>
          <select id="cfgCodeType">
            <option value="number">5 位数字</option>
            <option value="secret">5 位大写字母+数字</option>
          </select>
        </label>
        <label class="field"><span>类型白名单（逗号分隔或 *）</span><input id="cfgTypes" placeholder="jpg, png, zip 或 *"></label>
        <label class="field"><span>有效期上限（天，0=不限）</span><input id="cfgMaxSave" type="number" min="0" step="1"></label>
        <label class="field"><span>限流次数（每窗口/IP，0=关闭）</span><input id="cfgRateCount" type="number" min="0" step="1"></label>
        <label class="field"><span>限流窗口（秒）</span><input id="cfgRateWindow" type="number" min="1" step="1"></label>
        <label class="field"><span>未完成分片保留（小时）</span><input id="cfgChunkExpire" type="number" min="1" step="1"></label>
        <label class="check span2"><input id="cfgOpenUpload" type="checkbox"><span>开放匿名上传（关闭后仅管理员可发送）</span></label>
        <div class="span2"><button class="btn primary" type="submit">保存配置</button></div>
      </form>
    </details>

    <details open>
      <summary>分享记录</summary>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>取件码</th><th>类型</th><th>内容/文件名</th><th>大小</th>
            <th>已取/剩余</th><th>到期时间</th><th></th>
          </tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="btn ghost" id="prevPage">上一页</button>
        <span class="hint" id="pageInfo"></span>
        <button class="btn ghost" id="nextPage">下一页</button>
      </div>
    </details>
  </section>
</main>

<footer class="footer">
  FileSender <span id="ver"></span> · 收发同页 · 全相对路径 · 反向代理子路径可用
</footer>

<script src="app.js"></script>
</body>
</html>
